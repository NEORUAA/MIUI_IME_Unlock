name: Build Debug + Signed Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: sdkmanager --install "build-tools;34.0.0" --sdk_root=$ANDROID_HOME

      - name: Add Build Tools to PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ==================== 构建 Release APK ====================
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # ==================== 列出生成的文件（调试用） ====================
      - name: List Generated APK Files
        run: |
          echo "=== All APK files found ==="
          find app/build/outputs -name "*.apk" -type f | sort
      # ==================== 上传 Signed Release APK ====================
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: MIUI-IME-Unlock-Signed-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # ==================== 创建 GitHub Release ====================
      - name: Create Release and Upload Signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/WeType_UI_Enhanced-signed.apk
          tag_name: ${{ github.ref_name }}
          name: MIUI IME Unlock ${{ github.ref_name }}
          body: |
            ## 下载
            - **Signed Release APK**（推荐安装）：WeType_UI_Enhanced-signed.apk
            - Debug APK 请在 Artifacts 中下载
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
